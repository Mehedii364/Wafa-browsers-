name: Build Android Debug APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'APK_DOWNLOAD/**'
      - '.build-outputs/**'
      - '*.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Validate Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate Generated APK
        id: locate_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::No APK file found in app/build/outputs/apk/debug!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Copy APK to Output Directories
        run: |
          mkdir -p .build-outputs
          mkdir -p APK_DOWNLOAD

          cp "${{ steps.locate_apk.outputs.apk_path }}" .build-outputs/app-debug.apk
          cp "${{ steps.locate_apk.outputs.apk_path }}" APK_DOWNLOAD/app-debug.apk

      - name: Validate APK Structure & Integrity
        run: |
          echo "=== 1. File Listing ==="
          ls -lh APK_DOWNLOAD/app-debug.apk

          echo "=== 2. File Type Inspection ==="
          file APK_DOWNLOAD/app-debug.apk

          echo "=== 3. APK File Size Check ==="
          APK_SIZE=$(stat -c%s APK_DOWNLOAD/app-debug.apk)
          echo "APK Size: $APK_SIZE bytes"
          if [ "$APK_SIZE" -lt 500000 ]; then
            echo "::error::APK size ($APK_SIZE bytes) is suspiciously small or empty!"
            exit 1
          fi

          echo "=== 4. ZIP Structure Integrity Test ==="
          unzip -t APK_DOWNLOAD/app-debug.apk

      - name: Verify SHA256 Checksums
        run: |
          HASH1=$(sha256sum .build-outputs/app-debug.apk | awk '{print $1}')
          HASH2=$(sha256sum APK_DOWNLOAD/app-debug.apk | awk '{print $1}')

          echo "Hash (.build-outputs/app-debug.apk): $HASH1"
          echo "Hash (APK_DOWNLOAD/app-debug.apk):  $HASH2"

          if [ "$HASH1" != "$HASH2" ]; then
            echo "::error::SHA256 checksums do not match between build outputs!"
            exit 1
          fi

          echo "$HASH1  app-debug.apk" > APK_DOWNLOAD/app-debug.apk.sha256
          echo "$HASH1  app-debug.apk" > .build-outputs/app-debug.apk.sha256
          echo "SHA256 verification passed successfully!"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: APK_DOWNLOAD/app-debug.apk
          retention-days: 30

      - name: Commit and Push APK to Repository
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f .build-outputs/app-debug.apk .build-outputs/app-debug.apk.sha256
          git add -f APK_DOWNLOAD/app-debug.apk APK_DOWNLOAD/app-debug.apk.sha256

          if git diff --cached --quiet; then
            echo "No APK binary changes detected. Working tree clean."
          else
            git commit -m "build: automated build debug APK [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
